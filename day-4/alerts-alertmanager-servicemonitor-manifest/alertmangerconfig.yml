apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: main-rules-alert-config
  namespace: monitoring
  labels:
    release: monitoring
spec:
  route:
    repeatInterval: 30m
    receiver: 'null'
    routes:
    - matchers:
      - name: alertname
        value: HighCpuUsage
      receiver: 'send-discord' # match with `name` in `receivers`
    - matchers:
      - name: alertname
        value: PodRestart
      receiver: 'send-discord' # match with `name` in `receivers`
      repeatInterval: 5m
  receivers:
  - name: 'send-discord'
    discordConfigs:
    - apiURL:
        name: discord-webhook
        key: url
      sendResolved: false
  - name: 'null'
