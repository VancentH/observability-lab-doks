userconfig:
  service:
    extensions: [jaeger_storage, jaeger_query, healthcheckv2]
    pipelines:
      traces:
        receivers: [otlp, jaeger]
        exporters: [jaeger_storage_exporter]
  extensions:
    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133
    jaeger_query:
      storage:
        traces: primary_store
    jaeger_storage:
      backends:
        primary_store:
          elasticsearch:
            server_urls: ["https://elasticsearch-master.logging.svc:9200"]  # Replace with your Elasticsearch service DNS
            auth:
              basic:
                username: elastic  # Replace with the actual username if necessary
                password: 4ObAM2CA7BjHM7LG  # Replace with the actual password
            tls:
              ca_file: /tls/ca-cert.pem  # Path where the CA cert is mounted (see jaeger.extraVolumeMounts below)
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    # Legacy Jaeger protocol receiver — needed because day-4's service-a/service-b
    # still use @opentelemetry/exporter-jaeger (Thrift-over-HTTP to /api/traces on 14268),
    # not the newer OTLP exporter.
    jaeger:
      protocols:
        grpc:
          endpoint: 0.0.0.0:14250
        thrift_http:
          endpoint: 0.0.0.0:14268
        thrift_compact:
          endpoint: 0.0.0.0:6831
        thrift_binary:
          endpoint: 0.0.0.0:6832
  exporters:
    jaeger_storage_exporter:
      trace_storage: primary_store

# Mount the jaeger-tls ConfigMap (created in Step 5) into the all-in-one pod
# so the CA cert referenced above is available at /tls/ca-cert.pem.
jaeger:
  extraVolumes:
    - name: jaeger-tls
      configMap:
        name: jaeger-tls
  extraVolumeMounts:
    - name: jaeger-tls
      mountPath: /tls
      readOnly: true
